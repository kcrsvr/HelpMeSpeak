<?xml version="1.0" encoding="UTF-8"?>
<!--
  HelpMeSpeak app icon — source design.
  Export this to a 1024x1024 PNG (no transparency, no rounded corners — Apple
  applies the mask itself) and save it as assets/icon.png.

  Motif: a friendly speech bubble with a heart, on the app's primary blue —
  warm and simple, reflecting a communication aid for children.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: full-bleed brand blue (Apple masks the corners) -->
  <rect width="1024" height="1024" fill="#4A90D9"/>

  <!-- Soft radial glow to add depth -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5BA3E8"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Speech bubble -->
  <path d="M 512 210
           C 322 210 190 330 190 490
           C 190 610 265 710 380 752
           L 360 858
           C 356 878 378 892 395 880
           L 520 792
           C 522 792 512 792 512 792
           C 702 792 834 650 834 490
           C 834 330 702 210 512 210 Z"
        fill="#FFFFFF"/>

  <!-- Heart inside the bubble -->
  <path d="M 512 640
           C 512 640 372 556 372 456
           C 372 402 414 366 464 366
           C 494 366 512 386 512 386
           C 512 386 530 366 560 366
           C 610 366 652 402 652 456
           C 652 556 512 640 512 640 Z"
        fill="#E74C3C"/>
</svg>
